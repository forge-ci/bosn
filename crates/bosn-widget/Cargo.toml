[package]
name = "bosn-widget"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "bosn's floating desktop widget: a bubble, a panel and a full-view window onto the daemon dashboard."

# Not a workspace member: it links a native webview toolkit, which the CLI,
# daemon, wheels and CI must not.
[workspace]

# The local gate's host `lint-widget` lane and the remote `lint` job run
# `soldr lint rust --check --locked --manifest-path crates/bosn-widget/Cargo.toml`.
[workspace.metadata.soldr.lint]
steps = ["fmt", "clippy"]

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

[dependencies]
bosn-service = { path = "../bosn-service" }
kernal-api = { version = "=0.1.31", default-features = false, features = ["fs", "tauri-webview", "system-tray"] }

serde_json = "=1.0.149"

[build-dependencies]
toml = "=0.8.23"
