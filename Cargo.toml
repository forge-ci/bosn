[workspace]
members = ["crates/bosn", "crates/bosn-core", "crates/bosn-engine", "crates/bosn-generation", "crates/bosn-registry", "crates/bosn-service", "crates/bosn-python", "crates/bosn-setup"]
resolver = "3"
# The desktop widget links a webview toolkit; it builds on its own so the CLI,
# daemon and CI never link WebKitGTK, WebView2 or AppKit.
exclude = ["crates/bosn-widget"]

# The release version, and the only place it is written. `./bump` edits it;
# `bosn` (crates.io) and `bosn-python` (PyPI, via maturin's dynamic version)
# inherit it. The internal crates are never published and keep their own.
[workspace.package]
version = "0.1.32"

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

# `soldr lint` (soldr#3958) is bosn's one lint front door, on the host: lint
# never runs under bosn. It is the local gate's host `lint` lane and the
# remote `lint` job's command. The extras run the rest of that job: the
# kernal-api boundary, ruff, pyright and the repository guards (ci/lint.py
# --no-soldr) and the shared local-gate policy. An `extra` may not re-enter
# soldr (SOLDR_REENTRANCY_GUARD), so the widget crate the workspace excludes
# is its own `lint-widget` lane (crates/bosn-widget/Cargo.toml).
[workspace.metadata.soldr.lint]
steps = ["fmt", "clippy"]
extra = [
  ["python3", "ci/verify_kernel_boundary.py"],
  ["uv", "sync", "--frozen", "--all-groups", "--no-install-project"],
  ["uv", "run", "--no-sync", "python", "ci/lint.py", "--no-soldr"],
  ["uvx", "--from", "git+https://github.com/forge-ci/ci.yml@b761450a8eefc9390f97cd08e5f2d294da3d9100", "--with", "pyyaml==6.0.2", "ci-lint", "local-gate", "lint"],
]
