# Shared CI tool policy for Bosn (forge-ci/ci.yml#362).
# Run from a clean committed tree before pushing:
# uvx --from git+https://github.com/forge-ci/ci.yml@b761450a8eefc9390f97cd08e5f2d294da3d9100 ci-lint local-gate run
# The shared verifier proves source checks and provider identity, then writes
# Local-Gate and per-gate Ci-Attestation trailers. Bosn supplies raw receipts.
[gate]
run = ["bosn", "ci", "run", "--workspace", ".", "--workflow", ".github/workflows/ci.yml", "--event", "workflow_dispatch", "--input", "tier=test", "--mode", "minimal", "--engine", "act", "--timeout-secs", "3600", "--wait", "--deadline-ms", "3600000", "--json", "--ci-output", "verify:skip_rust", "--ci-output", "select-tier:test"]
verify = "ci.yml:verify"
# cancel-superseded (GEN-022, ci.yml#409) runs only on merge_group, first, with no `needs:`.
verify-exempt = ["ci-pre", "cancel-superseded"]
mode = "enforce"

[gate.isolation]
marker = "BOSN_TEST_ISOLATED"
runner = ["bosn", "ci", "run"]
proves-tree = true
guard = "tests/conftest.py"

# Lint never runs under bosn; soldr lint only. The two workflow selections
# replay tests only: Linux runs unit and Docker tests; Rust runs
# boundary/metadata checks and workspace tests. No replayed job lints
# (GATE-016): every lint step lives in the remote `lint` job, which the two
# host soldr lanes below run as the same commands and attest. `lint` is
# rustfmt and Clippy plus its Cargo.toml extras (boundary, ruff, pyright, the
# repository guards); `lint-widget` is the widget
# crate the workspace excludes.
[gate.lanes.lint]
run = ["soldr", "lint", "rust", "--check", "--locked", "--features", "bosn-python/embedded-python-tests"]
tools = ["soldr", "uv", "uvx", "python3"]

[gate.lanes.lint-widget]
run = ["soldr", "lint", "rust", "--check", "--locked", "--manifest-path", "crates/bosn-widget/Cargo.toml"]
tools = ["soldr"]

# The tests lane excludes only Rust test sources (bosn#503, see below); add
# other exclusions only with measured input evidence.
[gate.lanes.rust]
run = ["bosn", "ci", "run", "--workspace", ".", "--workflow", ".github/workflows/ci.yml", "--event", "workflow_dispatch", "--input", "tier=test", "--input", "pool_route=hosted", "--mode", "minimal", "--engine", "act", "--timeout-secs", "3600", "--wait", "--deadline-ms", "3600000", "--json", "--ci-output", "verify:skip_rust", "--ci-output", "select-tier:test", "--job", "rust"]
tools = ["bosn", "docker", "uv", "python"]

# GATE-007 `light`: this lane runs concurrently with the heavy Rust lane
# instead of after it (bosn#503). Both execute in their own isolated engines;
# measured on one tree, sequential 704 s vs concurrent 388 s.
[gate.lanes.tests]
weight = "light"
# bosn#503: Rust test sources cannot change the dev wheel (each is declared only
# behind `#[cfg(test)]` or is an integration-test target), so an edit to them
# alone reuses this lane's pass instead of rebuilding the wheel (~80 s) and
# rerunning pytest. Nothing is dropped: the rust lane keeps the whole tree and
# also runs every tests-lane check that reads these files (file length,
# include base, amalgamation). tests/test_tests_lane_inputs.py holds both.
exclude = ["crates/**/tests/**/*.rs", "crates/**/tests.rs", "crates/**/*_tests.rs"]
run = ["bosn", "ci", "run", "--workspace", ".", "--workflow", ".github/workflows/ci.yml", "--event", "workflow_dispatch", "--input", "tier=test", "--mode", "minimal", "--engine", "act", "--timeout-secs", "3600", "--wait", "--deadline-ms", "3600000", "--json", "--ci-output", "verify:skip_rust", "--ci-output", "select-tier:test", "--job", "linux"]
tools = ["bosn", "docker", "uv", "python"]

[gate.replay]
repository = "forge-ci/bosn"
workflow = "ci.yml"
mode = "minimal"
report-source = "stdout"
qualified = true
provider-query = ["bosn", "ci", "runners", "list", "--json"]

[[gate.replay.jobs]]
source-job = "ci.yml:verify"
lanes = ["rust", "tests"]

[[gate.replay.jobs]]
source-job = "ci.yml:pool"
lanes = ["rust"]

[[gate.replay.jobs]]
source-job = "ci.yml:reserve-pool"
lanes = ["rust"]

[[gate.replay.jobs]]
source-job = "ci.yml:rust"
lanes = ["rust"]

[[gate.replay.jobs]]
source-job = "ci.yml:select-tier"
lanes = ["tests"]

[[gate.replay.jobs]]
source-job = "ci.yml:linux"
lanes = ["tests"]

[[gate.replay.selections]]
lane = "rust"
job = "rust"
event = "workflow_dispatch"
inputs = { tier = "test", pool_route = "hosted" }

[[gate.replay.selections]]
lane = "tests"
job = "linux"
event = "workflow_dispatch"
inputs = { tier = "test" }

# Read from the PR base; changed policy/workflow surfaces, missing proof,
# forks, full labels and audit samples fail closed to ordinary remote checks.
# Default-branch and release coverage remain remote.
[gate.trust]
mode = "enforce"
skip = ["ci.yml:rust", "ci.yml:lint"]
covered-by = { "ci.yml:rust" = ["rust"], "ci.yml:lint" = ["lint", "lint-widget"] }
surfaces = []
